name: Lint and format 💅

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main
      - develop

# cpp-linter clears its previous report before writing a new one, which
# lists this PR comments even when there is nothing to report.
permissions:
  contents: read
  pull-requests: write

jobs:
  ledger-lint:
    uses: Zondax/_workflows/.github/workflows/_ledger_lint.yml@v3
    with:
      runs-on: ${{ github.repository_owner == 'zondax' && 'zondax-runners' || 'ubuntu-latest' }}